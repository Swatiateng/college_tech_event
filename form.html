<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <form id="registrationform">
<label>NAME:</label>
&nbsp;<input id="name" TYPE="TEXT" placeholder="ENTER
NAME"><BR>
<span id="usernameError" class="error"></span> <BR>

<label>EMAIL:</label>
<input id="email" placeholder="EMAIL"><BR>
<span id="emailError" class="error"></span> <BR>

<label>PHONE:</label>
<input id="phone" TYPE="number" placeholder="phone
number"><BR>
<span id="phoneError" class="error"></span> <BR>

<label>PASSWORD:</label>
<input id="password" TYPE="password"
placeholder="password"><BR>
<span id="passwordError" class="error"></span> <BR>

<label>CONFIRM PASSWORD:</label>
<input id="cpassword" TYPE="password" placeholder="re-enter the
password">
<span id="cpasswordError" class="error"></span> <BR>
<BR>
<label>YEAR:&nbsp;</label>
    I<input TYPE="RADIO" NAME="Y">
    II<input TYPE="RADIO" NAME="Y">
    III<input TYPE="RADIO" NAME="Y">
    IV<input TYPE="RADIO" NAME="Y">
<BR>

<BR>
<label>SKILLS:&nbsp;</label>
    C++<input TYPE="checkbox" >&nbsp;
    PYTHON<input TYPE="checkbox" >&nbsp;
    DJANGO<input TYPE="checkbox" >&nbsp;
    JAVA<input TYPE="checkbox" >&nbsp;
    GIT<input TYPE="checkbox" >&nbsp;
    LINUX<input TYPE="checkbox" >&nbsp;
    WEB3<input TYPE="checkbox" >&nbsp;
    BLOCKCHAIN<input TYPE="checkbox" >&nbsp;
<BR>
<BR>
<LABEl>BRANCH:</LABEl> <select >
    <optION>CSE</option>
    <optION>ISE</option>
    <optION>ECE</option>
    <optION>EEE</option>
    <optION>MECH</option>
    <optION>CIVIL</option><BR>
</select><br>&nbsp;
<br>
<LABEL>PROFILE PICTURE:</LABEL>
<INPUT TYPE="file" accept="PNG"><BR>&nbsp;

<button TYPE="submit">SUBMIT</button>&nbsp;
<button TYPE="RESET">RESET</button>
</form> 
</body>
</html>
